{% extends "auth_base.html" %}

{% block title %}Reset your password{% endblock %}
{% block tagline %}Let's get you back in.{% endblock %}

{% block auth_content %}
    <a href="{% url 'login' %}" class="auth-back"><span class="icon" data-icon="arrow-left"></span> Back to sign in</a>

    <div class="auth-head">
        <h2>Reset your password</h2>
        <p>Enter the email on your account and we'll send a reset link.</p>
    </div>

    <form class="auth-form" method="post" action="{% url 'password_reset' %}">
        {% csrf_token %}
        <label class="field" for="id_email">
            <span>Email</span>
            <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}" autocomplete="email" required autofocus>
            {% if form.email.errors %}<span class="field__error">{{ form.email.errors|join:" " }}</span>{% endif %}
        </label>

        <button type="submit" class="btn btn--primary btn--block">Send reset link</button>
    </form>
{% endblock %}
