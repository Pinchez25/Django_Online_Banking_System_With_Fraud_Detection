<div class="modal" id="payBillModal" role="dialog" aria-modal="true" aria-labelledby="payBillModalTitle" hidden>
    <div class="modal__panel">
        <div class="modal__head">
            <span class="modal__icon icon" data-icon="bill"></span>
            <h2 id="payBillModalTitle">Pay a bill</h2>
            <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
        </div>
        <div class="modal__form">
            <p class="field__hint">Bill payment is not yet enabled in this build. Use the deposit, withdrawal, and transfer actions for active banking activity.</p>
            <div class="modal__actions">
                <button type="button" class="btn btn--primary" data-modal-close>Close</button>
            </div>
        </div>
    </div>
</div>
