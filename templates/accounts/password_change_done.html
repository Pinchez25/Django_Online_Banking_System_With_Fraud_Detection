{% extends "base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}

        <div class="auth-status">
            <span class="auth-status__icon"><span class="icon" data-icon="check"></span></span>
            <div class="auth-head">

            <a href="{% url 'settings' %}" class="btn btn--primary">Back to settings</a>
        </div>
    </div>
{% endblock %}
