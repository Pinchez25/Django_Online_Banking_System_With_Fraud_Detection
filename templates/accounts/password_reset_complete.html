{% extends "auth_base.html" %}

{% block title %}Password updated{% endblock %}
{% block tagline %}All set.{% endblock %}

{% block auth_content %}
    <div class="auth-status">
        <span class="auth-status__icon"><span class="icon" data-icon="check"></span></span>
        <div class="auth-head">
            <h2>Password updated</h2>
            <p>Your password has been changed. You can now sign in with your new password.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn--primary">Sign in</a>
    </div>
{% endblock %}
